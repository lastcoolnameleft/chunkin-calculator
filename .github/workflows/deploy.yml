name: Validate, publish, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Validate production Compose configuration
        env:
          TRUST_PROXY: 172.20.0.0/16
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux runtime image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} --tag chunkin-check .
      - name: Smoke-test empty database, non-root runtime, and container health
        run: |
          set -euo pipefail
          trap 'docker logs chunkin-check; docker rm -f chunkin-check' EXIT
          docker run -d --name chunkin-check chunkin-check
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' chunkin-check)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' chunkin-check)" = healthy
          docker exec chunkin-check node -e "
            if(process.getuid()===0)process.exit(1);
            fetch('http://127.0.0.1:3000/api/events')
              .then(async r=>{if(!r.ok||(await r.json()).length!==0)process.exit(1)})
              .catch(()=>process.exit(1));
          "
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-results
          path: test-results/
          if-no-files-found: ignore

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/lastcoolnameleft/chunkin-calculator:latest
            ghcr.io/lastcoolnameleft/chunkin-calculator:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Watchtower
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WATCHTOWER_URL" || { echo "Missing WATCHTOWER_URL secret"; exit 1; }
          test -n "$WATCHTOWER_TOKEN" || { echo "Missing WATCHTOWER_TOKEN secret"; exit 1; }
          case "$WATCHTOWER_URL" in https://*) ;; *) echo "WATCHTOWER_URL must use HTTPS"; exit 1 ;; esac
          curl --fail --silent --show-error --connect-timeout 10 --max-time 120 \
            --request POST --get \
            --data-urlencode "images=ghcr.io/lastcoolnameleft/chunkin-calculator" \
            --header "Authorization: Bearer $WATCHTOWER_TOKEN" "$WATCHTOWER_URL"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public site after update
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            if ./scripts/check-deploy.sh https://distance.dfwtrebuchet.com; then exit 0; fi
            sleep 10
          done
          exit 1
